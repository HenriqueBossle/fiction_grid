services:
  app:
    build: .
    container_name: docker-fiction-grid
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./.env:/var/www/html/.env
    ports:
      - "9000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
      
      # Configurações do banco NeonDB (PostgreSQL)
      DB_CONNECTION: pgsql
      DB_HOST: ep-xxxxxx.us-east-2.aws.neon.tech
      DB_PORT: 5432
      DB_DATABASE: nome_do_banco
      DB_USERNAME: usuario_do_neon
      DB_PASSWORD: senha_do_neon
      DB_SSLMODE: require

      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      APP_URL: https://myapp.onrender.com
